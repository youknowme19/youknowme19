<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 160" width="100%" height="100%">
  <defs>
    <linearGradient id="timeline-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0d11"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="timeline-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="33%" stop-color="#3b82f6"/>
      <stop offset="66%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
  </defs>

  <style>
    .time-year {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #3b82f6;
      letter-spacing: 0.05em;
    }
    .time-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #ffffff;
    }
    .time-venue {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11px;
      fill: #71717a;
    }
    .time-status {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      font-size: 11px;
      fill: #a1a1aa;
    }
  </style>

  <!-- Container -->
  <rect width="1100" height="160" rx="10" fill="url(#timeline-bg)" stroke="#27272a" stroke-width="1"/>

  <!-- Connecting Timeline Line -->
  <path d="M 120 70 L 980 70" stroke="url(#timeline-line)" stroke-width="2"/>

  <!-- Milestone 1: HAL -->
  <g transform="translate(120, 70)">
    <circle r="6" fill="#10b981" stroke="#0c0d11" stroke-width="2"/>
    <text x="0" y="-35" text-anchor="middle" class="time-year">2026</text>
    <text x="0" y="-18" text-anchor="middle" class="time-title">HAL Open Science</text>
    <text x="0" y="24" text-anchor="middle" class="time-venue">Published Paper</text>
    <text x="0" y="40" text-anchor="middle" class="time-status">Neuro-Symbolic Fuzzing Basis</text>
  </g>

  <!-- Milestone 2: Current Engine -->
  <g transform="translate(410, 70)">
    <circle r="7" fill="#3b82f6" stroke="#0c0d11" stroke-width="2"/>
    <text x="0" y="-35" text-anchor="middle" class="time-year">CURRENT</text>
    <text x="0" y="-18" text-anchor="middle" class="time-title">Fuzzer Engine</text>
    <text x="0" y="24" text-anchor="middle" class="time-venue">Active Core Dev</text>
    <text x="0" y="40" text-anchor="middle" class="time-status">GNN + angr Hybrid System</text>
  </g>

  <!-- Milestone 3: arXiv -->
  <g transform="translate(700, 70)">
    <circle r="6" fill="#6366f1" stroke="#0c0d11" stroke-width="2"/>
    <text x="0" y="-35" text-anchor="middle" class="time-year">NEXT</text>
    <text x="0" y="-18" text-anchor="middle" class="time-title">arXiv Preprint</text>
    <text x="0" y="24" text-anchor="middle" class="time-venue">Manuscript Prep</text>
    <text x="0" y="40" text-anchor="middle" class="time-status">Structural Graph Embeddings</text>
  </g>

  <!-- Milestone 4: IEEE -->
  <g transform="translate(980, 70)">
    <circle r="6" fill="#52525b" stroke="#0c0d11" stroke-width="2"/>
    <text x="0" y="-35" text-anchor="middle" class="time-year">FUTURE</text>
    <text x="0" y="-18" text-anchor="middle" class="time-title">IEEE S&amp;P / TSE</text>
    <text x="0" y="24" text-anchor="middle" class="time-venue">Target Submission</text>
    <text x="0" y="40" text-anchor="middle" class="time-status">Zero-Day Vulnerability Benchmark</text>
  </g>
</svg>
