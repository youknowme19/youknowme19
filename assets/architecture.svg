<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0d11"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="flow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="arch-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .node-title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #ffffff;
    }
    .node-sub {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 10px;
      fill: #71717a;
    }
    .arrow-head {
      fill: #52525b;
    }
    .phase-label {
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #3b82f6;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Container Box -->
  <rect width="1100" height="240" rx="10" fill="url(#card-bg)" stroke="#27272a" stroke-width="1"/>
  <rect width="1100" height="240" rx="10" fill="url(#arch-grid)"/>

  <!-- Phase Dividers & Headers -->
  <g transform="translate(40, 25)">
    <text x="0" y="0" class="phase-label">PHASE 01: STRUCTURAL ANALYSIS</text>
    <text x="430" y="0" class="phase-label">PHASE 02: NEURAL PRIORITIZATION</text>
    <text x="790" y="0" class="phase-label">PHASE 03: SYMBOLIC VERIFICATION</text>
  </g>

  <!-- Flow Line Accent -->
  <path d="M 50 135 L 1050 135" stroke="url(#flow-line)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- Nodes Pipeline -->
  <g transform="translate(30, 75)">
    
    <!-- Node 1: Target Binary -->
    <g transform="translate(0, 0)">
      <rect width="110" height="70" rx="6" fill="#14151a" stroke="#27272a" stroke-width="1"/>
      <text x="55" y="32" text-anchor="middle" class="node-title">Target Binary</text>
      <text x="55" y="50" text-anchor="middle" class="node-sub">ELF / PE Raw</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 110 35 L 138 35" stroke="#52525b" stroke-width="1.5"/>
    <polygon points="138,31 145,35 138,39" class="arrow-head"/>

    <!-- Node 2: CFG & Disassembly -->
    <g transform="translate(145, 0)">
      <rect width="120" height="70" rx="6" fill="#14151a" stroke="#27272a" stroke-width="1"/>
      <text x="60" y="32" text-anchor="middle" class="node-title">CFG Extraction</text>
      <text x="60" y="50" text-anchor="middle" class="node-sub">angr / VEX IR</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 265 35 L 293 35" stroke="#52525b" stroke-width="1.5"/>
    <polygon points="293,31 300,35 293,39" class="arrow-head"/>

    <!-- Node 3: Graph Encoder -->
    <g transform="translate(300, 0)">
      <rect width="120" height="70" rx="6" fill="#14151a" stroke="#27272a" stroke-width="1"/>
      <text x="60" y="32" text-anchor="middle" class="node-title">Graph Encoder</text>
      <text x="60" y="50" text-anchor="middle" class="node-sub">AST Embeddings</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 420 35 L 448 35" stroke="#52525b" stroke-width="1.5"/>
    <polygon points="448,31 455,35 448,39" class="arrow-head"/>

    <!-- Node 4: GNN Predictor -->
    <g transform="translate(455, 0)">
      <rect width="130" height="70" rx="6" fill="#14151a" stroke="#3b82f6" stroke-width="1"/>
      <text x="65" y="32" text-anchor="middle" class="node-title" fill="#3b82f6">GNN Predictor</text>
      <text x="65" y="50" text-anchor="middle" class="node-sub">Risk Scores</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 585 35 L 613 35" stroke="#52525b" stroke-width="1.5"/>
    <polygon points="613,31 620,35 613,39" class="arrow-head"/>

    <!-- Node 5: Path Priority Queue -->
    <g transform="translate(620, 0)">
      <rect width="130" height="70" rx="6" fill="#14151a" stroke="#27272a" stroke-width="1"/>
      <text x="65" y="32" text-anchor="middle" class="node-title">Priority Ranking</text>
      <text x="65" y="50" text-anchor="middle" class="node-sub">Path Queue</text>
    </g>

    <!-- Arrow 5 -->
    <path d="M 750 35 L 778 35" stroke="#52525b" stroke-width="1.5"/>
    <polygon points="778,31 785,35 778,39" class="arrow-head"/>

    <!-- Node 6: Symbolic Executor -->
    <g transform="translate(785, 0)">
      <rect width="130" height="70" rx="6" fill="#14151a" stroke="#27272a" stroke-width="1"/>
      <text x="65" y="32" text-anchor="middle" class="node-title">Symbolic Executor</text>
      <text x="65" y="50" text-anchor="middle" class="node-sub">Z3 Solver</text>
    </g>

    <!-- Arrow 6 -->
    <path d="M 915 35 L 943 35" stroke="#52525b" stroke-width="1.5"/>
    <polygon points="943,31 950,35 943,39" class="arrow-head"/>

    <!-- Node 7: Vulnerability Bug -->
    <g transform="translate(950, 0)">
      <rect width="110" height="70" rx="6" fill="#14151a" stroke="#10b981" stroke-width="1"/>
      <text x="55" y="32" text-anchor="middle" class="node-title" fill="#10b981">Vulnerability</text>
      <text x="55" y="50" text-anchor="middle" class="node-sub">Crash Payload</text>
    </g>

  </g>

  <!-- Lower Architecture Metric Summary -->
  <g transform="translate(40, 180)">
    <text x="0" y="16" class="node-sub">Key Advantage: Replaces exhaustive BFS/DFS path traversal with neural heuristic scoring, cutting constraint solver overhead by up to 80%.</text>
  </g>
</svg>
