<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
  </defs>

  <style>
    .term-header-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      fill: #71717a;
      font-weight: 500;
    }
    .cmd-prompt {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      fill: #3b82f6;
      font-weight: 600;
    }
    .cmd-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      fill: #e4e4e7;
    }
    .out-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      fill: #a1a1aa;
    }
    .out-highlight {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13px;
      fill: #10b981;
      font-weight: 500;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Container Window -->
  <rect width="800" height="320" rx="10" fill="url(#term-bg)" stroke="#27272a" stroke-width="1"/>

  <!-- Top Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 36 L 0 36 Z" fill="#121318" stroke="#27272a" stroke-width="1"/>
  
  <!-- Window Control Buttons -->
  <circle cx="20" cy="18" r="5.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="36" cy="18" r="5.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="52" cy="18" r="5.5" fill="#10b981" opacity="0.8"/>

  <text x="400" y="22" text-anchor="middle" class="term-header-text">sandy@research-node:~</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 60)">
    <!-- Command 1 -->
    <text x="0" y="0">
      <tspan class="cmd-prompt">$ </tspan>
      <tspan class="cmd-text">whoami</tspan>
    </text>
    <text x="0" y="22" class="out-text">Sandeep — CS (Data Science) Undergraduate &amp; AI Security Researcher</text>

    <!-- Command 2 -->
    <text x="0" y="60">
      <tspan class="cmd-prompt">$ </tspan>
      <tspan class="cmd-text">focus</tspan>
    </text>
    <text x="0" y="82" class="out-text">AI Security <tspan fill="#38bdf8">•</tspan> Neuro-Symbolic Systems <tspan fill="#38bdf8">•</tspan> Binary Analysis <tspan fill="#38bdf8">•</tspan> GNNs</text>

    <!-- Command 3 -->
    <text x="0" y="120">
      <tspan class="cmd-prompt">$ </tspan>
      <tspan class="cmd-text">currently</tspan>
    </text>
    <text x="0" y="142" class="out-text">Building <tspan class="out-highlight">Neuro-Symbolic Fuzzer</tspan> &amp; Automated Security Analysis Tools</text>

    <!-- Command 4 -->
    <text x="0" y="180">
      <tspan class="cmd-prompt">$ </tspan>
      <tspan class="cmd-text">status</tspan>
    </text>
    <text x="0" y="202" class="out-highlight">Always Building.</text>

    <!-- Active Line -->
    <text x="0" y="240">
      <tspan class="cmd-prompt">$ </tspan>
      <tspan class="cursor" fill="#3b82f6">█</tspan>
    </text>
  </g>
</svg>
