<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>

    <!-- Radial Accent Glow -->
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      font-size: 52px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: -0.03em;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #888888;
      letter-spacing: -0.01em;
    }
    .badge-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #a1a1aa;
      letter-spacing: 0.08em;
    }
    .node-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      fill: #71717a;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#ffffff" stroke-opacity="0.06" rx="10"/>

  <!-- Right Visual: Clean Graph Network Motif -->
  <g transform="translate(760, 45)" opacity="0.9">
    <path d="M 40 120 L 130 50 L 240 100 L 300 40 L 210 190 L 110 200 Z" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 130 50 L 210 190 M 240 100 L 110 200 M 40 120 L 240 100" fill="none" stroke="#3f3f46" stroke-width="1"/>

    <!-- Nodes -->
    <g transform="translate(130, 50)">
      <circle r="18" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
      <circle r="5" fill="#3b82f6"/>
      <text x="26" y="4" class="node-text">GNN.predict()</text>
    </g>

    <g transform="translate(240, 100)">
      <circle r="15" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
      <circle r="4" fill="#6366f1"/>
      <text x="22" y="4" class="node-text">Z3.solve()</text>
    </g>

    <g transform="translate(210, 190)">
      <circle r="20" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <circle r="5" fill="#10b981"/>
      <text x="-40" y="34" class="node-text">fuzz_target()</text>
    </g>

    <g transform="translate(40, 120)">
      <circle r="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <circle r="3" fill="#a855f7"/>
      <text x="-70" y="4" class="node-text">CFG.extract()</text>
    </g>

    <g transform="translate(300, 40)">
      <circle r="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <circle r="3" fill="#f59e0b"/>
    </g>

    <g transform="translate(110, 200)">
      <circle r="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <circle r="3" fill="#ec4899"/>
    </g>
  </g>

  <!-- Left Content -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="240" height="26" rx="13" fill="#14151a" stroke="#27272a" stroke-width="1"/>
      <circle cx="14" cy="13" r="3.5" fill="#10b981"/>
      <text x="26" y="17" class="badge-text">NEURO-SYMBOLIC FUZZING</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="138" class="title">Sandeep</text>

    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle">Building AI systems, security research, and</text>
    <text x="0" y="218" class="subtitle">software that solves real engineering problems.</text>

    <!-- Subtle Tags -->
    <g transform="translate(0, 260)">
      <rect width="155" height="24" rx="5" fill="#121316" stroke="#27272a" stroke-width="1"/>
      <text x="10" y="16" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#71717a">Neuro-Symbolic AI</text>

      <rect x="167" y="0" width="145" height="24" rx="5" fill="#121316" stroke="#27272a" stroke-width="1"/>
      <text x="177" y="16" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#71717a">Binary Vulnerabilities</text>

      <rect x="324" y="0" width="165" height="24" rx="5" fill="#121316" stroke="#27272a" stroke-width="1"/>
      <text x="334" y="16" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" fill="#71717a">Graph Neural Networks</text>
    </g>
  </g>
</svg>
