<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>

    <!-- Card Border / Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333333" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#666666" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#333333" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#ffffff" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 56px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: -0.03em;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #888888;
      letter-spacing: -0.01em;
    }
    .badge-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      font-weight: 500;
      fill: #a1a1aa;
      letter-spacing: 0.05em;
    }
    .node-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      fill: #71717a;
    }
    .pulse-node {
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Border lines (Vercel subtle frame aesthetic) -->
  <rect x="1" y="1" width="1198" height="398" fill="none" stroke="#ffffff" stroke-opacity="0.06" rx="12"/>

  <!-- Decorative Abstract Architecture / Graph Graphics on Right -->
  <g transform="translate(750, 60)" opacity="0.85">
    <!-- Graph Lines -->
    <path d="M 50 140 L 150 60 L 260 120 L 320 50 L 220 220 L 120 240 Z" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 150 60 L 220 220 M 260 120 L 120 240 M 50 140 L 260 120" fill="none" stroke="#3f3f46" stroke-width="1"/>

    <!-- Graph Nodes -->
    <g transform="translate(150, 60)">
      <circle r="20" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
      <circle r="5" fill="#3b82f6"/>
      <text x="30" y="4" class="node-text">GNN.predict()</text>
    </g>

    <g transform="translate(260, 120)">
      <circle r="16" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
      <circle r="4" fill="#6366f1"/>
      <text x="24" y="4" class="node-text">Z3.solve()</text>
    </g>

    <g transform="translate(220, 220)">
      <circle r="24" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <circle r="6" fill="#10b981"/>
      <text x="-40" y="40" class="node-text">fuzz_target()</text>
    </g>

    <g transform="translate(50, 140)">
      <circle r="14" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <circle r="4" fill="#a855f7"/>
      <text x="-75" y="4" class="node-text">AST.parse()</text>
    </g>

    <g transform="translate(320, 50)">
      <circle r="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <circle r="3" fill="#f59e0b"/>
    </g>

    <g transform="translate(120, 240)">
      <circle r="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
      <circle r="3" fill="#ec4899"/>
    </g>
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 72)">
      <rect width="210" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#10b981"/>
      <text x="30" y="18" class="badge-text">AI SECURITY &amp; SYSTEMS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">Sandeep</text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="225" class="subtitle">Building AI systems, security research, and</text>
    <text x="0" y="255" class="subtitle">software that solves real problems.</text>

    <!-- Tech focus tags -->
    <g transform="translate(0, 310)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="26" rx="6" fill="#121316" stroke="#27272a" stroke-width="1"/>
        <text x="12" y="17" font-family="SFMono-Regular, monospace" font-size="11" fill="#71717a">Neuro-Symbolic AI</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(180, 0)">
        <rect width="150" height="26" rx="6" fill="#121316" stroke="#27272a" stroke-width="1"/>
        <text x="12" y="17" font-family="SFMono-Regular, monospace" font-size="11" fill="#71717a">Binary Analysis</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(340, 0)">
        <rect width="180" height="26" rx="6" fill="#121316" stroke="#27272a" stroke-width="1"/>
        <text x="12" y="17" font-family="SFMono-Regular, monospace" font-size="11" fill="#71717a">Full-Stack Systems</text>
      </g>
    </g>
  </g>
</svg>
