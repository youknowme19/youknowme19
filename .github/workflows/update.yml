name: Auto Sync & Research Updater

on:
  schedule:
    - cron: "0 12 * * 1" # Weekly refresh on Monday
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Links & Research Feed
        run: |
          echo "Syncing research publications and profile indicators..."
          date -u > assets/.last_updated

      - name: Commit Sync Status
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/.last_updated || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated profile metrics sync [skip ci]" && git push)
